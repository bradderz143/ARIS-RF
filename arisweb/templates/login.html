<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIS Login</title>
<style>
body{background:#0b0f19;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#111827;padding:24px;border:1px solid #10b981;border-radius:12px;width:85%;max-width:340px}
h2{color:#10b981;margin-top:0}
input{width:100%;padding:12px;margin:8px 0 16px;background:#1f2937;border:1px solid #374151;color:#fff;border-radius:8px;box-sizing:border-box;font-size:1rem}
button{width:100%;padding:12px;background:#10b981;color:#000;font-weight:bold;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
.err{color:#ef4444;margin-bottom:10px}
</style></head><body><div class="box"><h2>ARIS</h2>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post"><label>Username</label><input type="text" name="username" required autocapitalize="none">
<label>Password</label><input type="password" name="password" required>
<button type="submit">Sign In</button></form></div></body></html>
